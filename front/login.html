<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice IA - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@300;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@23.0.4/build/css/intlTelInput.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line-2);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
        }
        .form-group { margin-bottom: 20px; }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--line-2);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        .iti { width: 100%; display: block; }
    </style>
</head>
<body>
    <div class="bg-geo"></div>
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="logotipo.png" alt="Logo" style="width: 60px; margin: 0 auto 10px; border-radius: 50%;">
            <h2 class="section-title" style="font-size: 1.5rem; margin-bottom: 5px;">Bienvenido</h2>
            <p class="section-sub">Inicia sesión en tu panel</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label style="color:#ccc; font-size:13px; display:block; margin-bottom:8px;">Número de WhatsApp</label>
                <input type="tel" id="telefono" class="form-control" required>
            </div>
            <div class="form-group">
                <label style="color:#ccc; font-size:13px; display:block; margin-bottom:8px;">Contraseña</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
            <div id="formMessage" style="margin-top: 15px; text-align: center; color: #ef4444; display: none;"></div>
        </form>
        <div style="text-align: center; margin-top: 20px; font-size: 13px;">
            <a href="index.html" style="color: var(--accent);">¿No tienes cuenta? Regístrate aquí</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@23.0.4/build/js/intlTelInput.min.js"></script>
    <script>
        const BACKEND_URL = 'http://localhost:5000'; // Cambiar a Render URL en producción

        const inputTelefono = document.querySelector("#telefono");
        const iti = window.intlTelInput(inputTelefono, {
            utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@23.0.4/build/js/utils.js",
            initialCountry: "auto",
            separateDialCode: true,
            geoIpLookup: function(callback) {
                fetch("https://ipapi.co/json").then(r => r.json()).then(d => callback(d.country_code)).catch(() => callback("us"));
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const telefonoCompleto = iti.getNumber();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('formMessage');

            try {
                const res = await fetch(`${BACKEND_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefonoCompleto, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('voice_token', data.token);
                    localStorage.setItem('voice_user', JSON.stringify(data.user));
                    
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    const err = await res.json();
                    msg.textContent = err.message || 'Error de credenciales';
                    msg.style.display = 'block';
                }
            } catch (err) {
                msg.textContent = 'Error de conexión con el servidor.';
                msg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
